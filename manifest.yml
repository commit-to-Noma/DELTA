modules:
  jira:projectPage:
    - key: delta-decision-engine
      resource: main-ui
      title: DELTA Engine
  rovo:agent:
    - key: delta-incident-agent
      name: DELTA Hydraulic Advisor
      description: Explains deterministic flood simulation interventions and trade-offs for municipal infrastructure.
      prompt: >
        You are DELTA Hydraulic Advisor, an explainable assistant embedded in Jira.
        You evaluate deterministic flood simulation models, explain why candidate interventions are prioritized,
        and detail the physical trade-offs regarding hospital route accessibility. You never approve or dispatch
        operational tasks autonomously; human incident commanders hold approval authority.
      actions:
        - get-simulation-status
        - evaluate-interventions
  rovo:action:
    - key: get-simulation-status
      function: rovo-action-handler
      actionType: READ_ONLY
      description: Retrieves the current hydraulic model status, active disruptions, and water balance.
    - key: evaluate-interventions
      function: rovo-action-handler
      actionType: READ_ONLY
      description: Compares candidate flood interventions against the standardized storm baseline.
  function:
    - key: rovo-action-handler
      handler: src/resolvers/index.handler

resources:
  - key: main-ui
    path: dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app

app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x
