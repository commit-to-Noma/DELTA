modules:
  jira:projectPage:
    - key: delta-decision-engine
      resource: main-ui
      title: DELTA Engine
      resolver:
        function: rovo-action-handler
  jira:issuePanel:
    - key: delta-decision-issue-panel
      title: DELTA Flood Mitigation Decision
      icon: https://raw.githubusercontent.com/commit-to-Noma/DELTA/main/public/delta-logo.svg
      resource: main-ui
      resolver:
        function: rovo-action-handler
  rovo:mcp:
    - key: delta-hydraulic-mcp
      name: DELTA Hydraulic MCP
      tools:
        - get-simulation-status
        - evaluate-interventions
        - get-decision-record
        - list-decision-records
        - query-teamwork-graph
        - query-facility-dependencies

  jira:workflowValidator:
    - key: delta-decision-record-validator
      name: DELTA Decision Record Approval Gate
      description: Blocks issue transitions to Dispatched or Resolved unless an approved DELTA Decision Record is linked in Forge KVS.
      function: workflow-validator
  rovo:agent:
    - key: delta-incident-agent
      name: DELTA Hydraulic Advisor
      description: Explains deterministic flood simulation interventions and
        trade-offs for municipal infrastructure.
      prompt: >
        You are DELTA Hydraulic Advisor, an explainable assistant embedded in
        Jira. You evaluate deterministic flood simulation models, explain why
        candidate interventions are prioritized, and detail the physical
        trade-offs regarding hospital route accessibility. You never approve or
        dispatch operational tasks autonomously; human incident commanders hold
        approval authority.
      actions:
        - get-simulation-status
        - evaluate-interventions
        - get-decision-record
        - list-decision-records
        - query-teamwork-graph
        - query-facility-dependencies
  action:
    - key: get-simulation-status
      name: Get Simulation Status
      function: rovo-action-handler
      actionVerb: GET
      description: Retrieves the current hydraulic model status, active disruptions, and water balance.
    - key: evaluate-interventions
      name: Evaluate Interventions
      function: rovo-action-handler
      actionVerb: GET
      description: Compares candidate flood interventions against the standardized storm baseline.
    - key: get-decision-record
      name: Get Decision Record
      function: rovo-action-handler
      actionVerb: GET
      description: Retrieves an immutable, human-approved mitigation decision record by ID.
      inputs:
        decisionId:
          title: Decision ID
          type: string
          required: true
          description: The DELTA decision record ID to retrieve (for example DEC-2026-081)
    - key: list-decision-records
      name: List Decision Records
      function: rovo-action-handler
      actionVerb: GET
      description: Lists recent immutable hydraulic mitigation decision records.
    - key: query-teamwork-graph
      name: Query Teamwork Graph
      function: rovo-action-handler
      actionVerb: GET
      description: Queries live Jira issues on the active project alongside Boston Longwood spatial catchment nodes.
      inputs:
        filterType:
          title: Node Type Filter
          type: string
          required: false
          description: Optional node type filter (HEALTHCARE_FACILITY, MUNICIPAL_DRAINAGE, DISPATCH_WORK_ORDER)
    - key: query-facility-dependencies
      name: Query Facility Dependencies
      function: rovo-action-handler
      actionVerb: GET
      description: Returns drainage dependencies for a healthcare facility.
      inputs:
        facilityId:
          title: Facility ID
          type: string
          required: true
          description: Facility node ID (for example FACILITY-BWH)
  function:
    - key: rovo-action-handler
      handler: resolvers/index.handler
    - key: workflow-validator
      handler: resolvers/workflowValidator.handler

resources:
  - key: main-ui
    path: dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - write:confluence-content
    - read:space:confluence
    - read:jira-user

app:
  id: ari:cloud:ecosystem::app/7c4b604a-2340-4df7-8c0a-8fd8e44b7a12
  runtime:
    name: nodejs22.x

